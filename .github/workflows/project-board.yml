name: 项目看板同步

on:
  pull_request_target:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  release:
    types: [published, edited, deleted]
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    # Issue 的编辑、标签与开闭合并到小时同步，避免模板补齐期间逐事件移动。
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: peach-project-board
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'peach-mitao/peach'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      # 组织看板不接受仓库默认令牌；peach-board App 只有看板写权限与本仓库只读权限，令牌一小时过期。
      - id: board-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROJECT_BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROJECT_BOARD_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: peach
      - name: 同步 Issue、PR、已发布版本与看板
        env:
          GH_TOKEN: ${{ steps.board-token.outputs.token }}
          PYTHONUTF8: '1'
        run: python scripts/project_board.py --apply --event "$GITHUB_EVENT_PATH"
